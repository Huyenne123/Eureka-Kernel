jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        device:
          - a10
          - a20
          - a30
          - a30s
          - a40

    env:
      DEFCONFIG: exynos7885-${{ matrix.device }}_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0

      # ... giữ nguyên các step khác ...

      - name: Enable KernelSU in defconfig
        working-directory: ./kernel
        run: |
          CFG=arch/arm64/configs/${DEFCONFIG}

          echo "CONFIG_KALLSYMS=y" >> "$CFG"
          echo "CONFIG_KALLSYMS_ALL=y" >> "$CFG"
          echo "CONFIG_KSU=y" >> "$CFG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CFG"
          echo "# CONFIG_KPROBES is not set" >> "$CFG"
          echo "# CONFIG_HAVE_KPROBES is not set" >> "$CFG"
          echo "# CONFIG_KPROBES_EVENTS is not set" >> "$CFG"

          tail -10 "$CFG"

      - name: Configure kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r ${DEFCONFIG}

      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make -j$(nproc) O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.device }}
          path: kernel/build.log

      - name: Prepare AnyKernel from source
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image anykernel/

      - name: Create flashable zip
        run: |
          cd anykernel
          zip -r9 ../neyuKernel_${{ matrix.device }}.zip *
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: neyuKernel_${{ matrix.device }}
          path: neyuKernel_${{ matrix.device }}.zip
