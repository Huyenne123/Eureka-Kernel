name: Build R15-OneUI + BPF merge from R24U

on:
  workflow_dispatch:
  push:
    branches: [ testing ]

env:
  KERNEL_BRANCH: testing

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
    
            # 2. Clone KernelSU-Next (v3.1.0-legacy)
      - name: Clone KernelSU-Next
        working-directory: ./kernel
        run: |
          git clone --branch v3.1.0-legacy --depth 1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next

      # 3. Run KernelSU-Next setup script
      - name: Run KernelSU-Next setup
        working-directory: ./kernel
        run: |
          chmod +x KernelSU-Next/kernel/setup.sh
          ./KernelSU-Next/kernel/setup.sh

      # 4. Disable hook verification in Kbuild (workaround)
      - name: Disable hook verification
        working-directory: ./kernel
        run: |
          sed -i 's/^.*No hooks were defined.*/# &/' drivers/kernelsu/Kbuild
          echo "Hook check disabled."

      # 5. Patch ksud.c to fix const qualifier error in copy_to_iter
      - name: Patch ksud.c for copy_to_iter
        working-directory: ./kernel
        run: |
          sed -i 's/^\(\s*copy_to_iter\)(KERNEL_SU_RC + ksu_rc_pos,/\1((void *)(KERNEL_SU_RC + ksu_rc_pos),/' drivers/kernelsu/ksud.c
          echo "ksud.c patched."

      # 6. Verify integration (optional)
      - name: Verify KernelSU integration
        working-directory: ./kernel
        run: |
          echo "=== KernelSU-Next directory contents ==="
          ls -la KernelSU-Next/
          echo "=== Kernel Makefile (check for KernelSU include) ==="
          grep -i "KernelSU" Makefile || echo "KernelSU not found in Makefile"
          echo "=== Kernel Kconfig (check for KernelSU source) ==="
          grep -i "KernelSU" Kconfig || echo "KernelSU not found in Kconfig"

      # 7. Enable KernelSU and kprobes options in defconfig
      - name: Enable KernelSU and kprobes in defconfig
        working-directory: ./kernel
        run: |
          # KernelSU options
          echo "# KernelSU-Next" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "CONFIG_KSU_WITH_KPROBES=y" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "# CONFIG_KSU_DEBUG is not set" >> arch/arm64/configs/exynos7885-a30_defconfig
          # Full kprobes support
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "CONFIG_MODULES=y" >> arch/arm64/configs/exynos7885-a30_defconfig
          echo "CONFIG_MODULE_UNLOAD=y" >> arch/arm64/configs/exynos7885-a30_defconfig
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu
      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH
      - name: Set environment
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
      - name: Configure kernel
        working-directory: ./kernel
        run: |
          make O=out ARCH=arm64 exynos7885-a30_defconfig
          
      - name: Build kernel
        working-directory: ./kernel
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Prepare AnyKernel from source
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image anykernel/

      - name: Create flashable zip
        run: |
          cd anykernel
          zip -r9 ../Eureka_R15-BPF.zip *
          cd ..
      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Eureka_R15-BPF
          path: Eureka_R15-BPF.zip
